aid: dati-comune-matera-it
name: Portale Dati aperti del Comune di Matera
description: >-
  Portale Dati aperti del Comune di Matera is a open data portal open-data portal for Italy running CKAN.
  It exposes the CKAN catalog API, a standardized machine-readable interface over approximately 250 datasets,
  supporting programmatic dataset search, metadata retrieval, and resource access. Because it runs CKAN, it shares a
  consistent API surface with every other CKAN portal, making it uniformly harvestable and integrable.
