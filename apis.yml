apis:
  - aid: dati-comune-matera-it:catalog
    name: Portale Dati aperti del Comune di Matera CKAN Action API
    description: >-
      CKAN Action API for Portale Dati aperti del Comune di Matera, a consistent JSON-over-HTTP interface over a catalog of 250 datasets. Standard actions include package_search, package_show, package_list, organization_list, group_list, tag_list, and resource_search; datastore_search is available where the DataStore extension is enabled. Base URL https://dati.comune.matera.it/api/3/action/.
